services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-https://example.com}
    image: jagmeet-portfolio:latest
    container_name: jagmeet-portfolio
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
